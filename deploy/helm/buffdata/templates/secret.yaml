{{- if and (eq .Values.secretBackend "env") (or .Values.apiKeys.geminiApiKey .Values.apiKeys.openaiApiKey .Values.apiKeys.anthropicApiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buffdata.fullname" . }}-api-keys
  labels:
    {{- include "buffdata.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.apiKeys.geminiApiKey }}
  gemini-api-key: {{ .Values.apiKeys.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.apiKeys.openaiApiKey }}
  openai-api-key: {{ .Values.apiKeys.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.apiKeys.anthropicApiKey }}
  anthropic-api-key: {{ .Values.apiKeys.anthropicApiKey | quote }}
  {{- end }}
{{- end }}
