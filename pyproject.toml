[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buffdata"
version = "0.3.0"
description = "Provider-neutral adaptive AI training-data optimizer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "BuffData Team" }
]
dependencies = [
    "google-genai>=1.0.0",
    "openai>=3.6.0",
    "anthropic>=1.2.0",
    "pydantic>=2.5.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "aiofiles>=23.2.0",
    "pyarrow>=14.0.0",
    "pandas>=2.1.0",
    "polars>=1.0.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.3",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "huggingface_hub>=0.20.0",
    "datasets>=2.16.0",
    "PyMuPDF>=1.23.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
productivity = [
    "graphifyy[mcp]>=0.9.53",
]
enterprise = [
    "boto3>=1.34.0",
    "hvac>=2.1.0",
    "google-cloud-secret-manager>=2.20.0",
    "azure-identity>=1.16.0",
    "azure-keyvault-secrets>=4.8.0",
    "fsspec>=2024.6.0",
    "s3fs>=2024.6.0",
    "gcsfs>=2024.6.0",
    "adlfs>=2024.7.0",
    "pyjwt[crypto]>=2.9.0",
    "ray[default]>=2.9.0",
]
observability = [
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-client>=0.20.0",
]

[project.scripts]
buffdata = "buffdata.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["buffdata*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
